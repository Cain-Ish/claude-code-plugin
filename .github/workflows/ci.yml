# R8 minimal CI — the server-side backstop for the bypassed-hook /
# other-machine case. Supply-chain posture: ONLY official actions, SHA-pinned
# (lightweight tags resolved via the GitHub API at authoring time), top-level
# read-only token, no secrets, no third-party actions.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so origin/main resolves — the release version-bump
          # tripwire diffs the PR head against the base release.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install mcp deps (lockfile-exact)
        run: npm ci --prefix mcp
      - name: Typecheck
        run: cd mcp && npx tsc --noEmit
      - name: Vitest
        run: cd mcp && npm test
        env:
          # CI has no network to HuggingFace — the ~70MB embedding model can't be
          # fetched, and a fetch attempt HANGS past the 5s test timeout. Run the
          # suite deterministically WITHOUT the model: DISABLE skips embeddings;
          # HF_HUB_OFFLINE makes transformers fail FAST (no network) for the few
          # tests that re-enable embeddings (they now assert the model-absent
          # no-poison contract). Offline-first by design — CI never downloads a
          # model. The embedding/RRF path is covered locally where the model exists.
          SECOND_BRAIN_DISABLE_EMBEDDINGS: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - name: Bundle-current gate
        run: bash tests/test-bundle-current.sh
      - name: Bash test suite
        run: bash tests/run-all.sh
        env:
          SB_RUN_ALL_VITEST: '0' # vitest already ran above
      - name: Plugin validator
        run: bash scripts/validate-plugin.sh
      - name: Release version-bump tripwire
        # Server-side backstop: a PR that changes shipped source MUST bump the
        # version. base_ref is set only for pull_request events; for push-to-main
        # the test falls back to origin/main (== HEAD post-merge -> no-op pass).
        run: bash tests/test-release-version-bump.sh
        env:
          SB_RELEASE_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}

  macos:
    # Closes the standing "run dream-lifecycle on real macOS" PROJECT.md item
    # without buying hardware: bash 3.2 + BSD userland are the actual targets
    # of the portability guards.
    runs-on: macos-latest
    # Raised 15 -> 25 (0.54.0): added the extraction-helpers + merge-project-update steps below;
    # test-merge-project-update.sh alone is costed at up to ~776s on a heavily loaded MSYS box
    # (its own run-all-timeout header) -- macOS forks natively and should be far faster, but there
    # was no prior macOS-lane data point for it, so the raise buys headroom rather than guessing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: dream lifecycle on bash 3.2 / BSD coreutils
        run: /bin/bash tests/test-dream-lifecycle.sh
      - name: portability static guards
        run: /bin/bash tests/test-script-portability.sh
      - name: every shipped script PARSES under bash 3.2 (issue #100 class)
        # `bash -n` is the only direct oracle for 3.2-parser hazards; the static guards
        # above are heuristics. Hooks that fail to parse exit 2 silently at SessionStart.
        run: |
          rc=0
          for f in scripts/*.sh bin/*.sh hooks/*.sh; do
            [ -f "$f" ] || continue
            /bin/bash -n "$f" || { echo "PARSE FAIL under bash 3.2: $f"; rc=1; }
          done
          exit $rc
      - name: lib extraction-loop units
        run: |
          /bin/bash tests/test-stop-extract.sh
          /bin/bash tests/test-dream-autostage.sh
      # Continuity (0.54.0) on bash 3.2 + BSD awk/sed: the Plan reconcile awk (match/RSTART,
      # /dev/stderr) and the sb_timeout watchdog fallback (no `timeout` on stock macOS)
      # run nowhere else in CI.
      - name: continuity units (Plan merge, compact re-inject)
        run: |
          /bin/bash tests/test-project-plan-block.sh
          /bin/bash tests/test-session-load-compact.sh
      # X.1 (loop-eng research): the capture→store→recall pipeline END TO END on real
      # bash 3.2 + BSD coreutils — unit suites stayed green while the loop died
      # per-platform; this is the composition lock. Needs node (present on the runner).
      - name: loop smoke (capture→store→recall composition)
        run: /bin/bash tests/test-loop-smoke.sh
      # F2 (0.54.0): sb_timeout's bash-watchdog fallback (no timeout(1)/gtimeout on stock macOS)
      # is a macOS-ONLY code path -- it runs nowhere else in CI, so test-extraction-helpers.sh's
      # F2 case only ever exercises the real bug's platform here. test-merge-project-update.sh
      # rides along on the same native-fork host for a change the controller owns this cycle.
      - name: extraction-helpers (F2 macOS-only watchdog) + merge-project-update
        run: |
          /bin/bash tests/test-extraction-helpers.sh
          /bin/bash tests/test-merge-project-update.sh

  windows:
    # V4 (docs/researchs/2026-09-26-borrow-ledger.md): Windows Git-Bash is the primary dev
    # platform, and every Windows bug class in the archaeology shipped through green
    # linux/macos CI. Class subset only (the full suite was costed at ~28 min on Windows).
    # `shell: bash` here = Git for Windows bash (-eo pipefail); jq on this image is the native
    # Windows build (1.8.1, CRLF stdout) — the real CRLF class, not the stub.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: toolchain facts (fails if a test dependency is missing)
        run: |
          uname -s; bash --version | head -1
          # one name per `command -v`: with several names it exits 0 when ANY of them resolves
          for b in jq cygpath timeout git node; do command -v "$b" > /dev/null || { echo "::error::$b missing"; exit 1; }; done
          timeout --version | head -1 | grep -q coreutils || { echo "::error::timeout is not GNU coreutils"; exit 1; }
          jq --version
          printf '{"a":"x"}' | jq -r .a | od -An -tx1
          # Advisory only (F9 CRLF-lane premise): warn, don't fail, if this runner's jq
          # ever stops emitting CRLF -- the CRLF stub in test-jq-crlf-windows.sh exists
          # to reproduce that Windows behaviour on non-Windows CI; if the native runner
          # jq itself stopped doing it, the "real CRLF class, not the stub" claim above
          # would be false on this image without anyone noticing.
          printf '{"a":"x"}' | jq -r .a | od -An -tx1 | grep -q '0d 0a' || echo "::warning::runner jq does not emit CRLF — the CRLF lane premise does not hold on this image"
      - name: path, guard, jq-CRLF, exec-bit and continuity classes on real Git-Bash
        run: |
          rc=0
          for t in normalize-path symlink-guard persona-tool-guard wiki-write-guard guard-wiring \
                   jq-crlf-windows exec-bits session-load-compact merge-project-update \
                   project-plan-block stop-extract extraction-helpers; do
            echo "::group::test-$t"
            if bash "tests/test-$t.sh"; then echo "ok test-$t"; else echo "::error::test-$t FAILED"; rc=1; fi
            echo "::endgroup::"
          done
          exit $rc
