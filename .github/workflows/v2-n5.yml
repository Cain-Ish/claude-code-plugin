# second-brain v2 (06, section 4, 4a): N5, the macOS self-test hang. This round runs only the bytes probe (chunks.mjs):
# round 2: arms F (readFileSync), C (readSync, logged) and C2 (readSync). The full lane and the seven-arm probe ran
# on bdac932; the full lane returns for the fix's bar.
name: v2-n5
on:
  push:
    branches: [v2]
    paths: ['.github/workflows/v2-n5.yml']
  workflow_dispatch:
jobs:
  chunks:
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: 300 calls per arm
        timeout-minutes: 35
        run: node docs/v2/probes/V2-D18-hang/chunks.mjs 300 "$RUNNER_TEMP/chunks"
      - name: the record
        if: always()
        run: cat "$RUNNER_TEMP/chunks/chunks.json" || true
